name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build fullDebug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare local properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
          LOCAL_DEV_PROPERTIES_BASE64: ${{ secrets.LOCAL_DEV_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
          else
            touch local.properties
          fi

          # Simkl client ID (public value) so Simkl sign-in works in this build.
          echo >> local.properties
          grep -q '^SIMKL_CLIENT_ID=' local.properties || {
            echo "SIMKL_CLIENT_ID=7e7ce760063b730567dad8f435bce0ed65099514eace81c6eda5efa10f16e176" >> local.properties
            echo "SIMKL_APP_NAME=nuvio" >> local.properties
          }

          if [ -n "$LOCAL_DEV_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_DEV_PROPERTIES_BASE64" | base64 --decode > local.dev.properties
          else
            touch local.dev.properties
          fi

      - name: Prepare CI signing config
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/ci-debug.jks" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/ci-debug.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=androiddebugkey"
            echo "NUVIO_RELEASE_KEY_PASSWORD=android"
            echo "NUVIO_RELEASE_STORE_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Restore fixed debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          else
            echo "No DEBUG_KEYSTORE_BASE64 secret set; a new debug key will be generated for this build."
          fi

      - name: Build fullDebug APK
        shell: bash
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          SIGN_ARGS=""
          if [ -n "$DEBUG_KEYSTORE_BASE64" ] && [ -f "$HOME/.android/debug.keystore" ]; then
            SIGN_ARGS="-Pandroid.injected.signing.store.file=$HOME/.android/debug.keystore -Pandroid.injected.signing.store.password=android -Pandroid.injected.signing.key.alias=androiddebugkey -Pandroid.injected.signing.key.password=android"
          fi
          ./gradlew :app:assembleFullDebug --stacktrace $SIGN_ARGS 2>&1 | tee build.log

      - name: Show compile errors
        if: failure()
        run: |
          echo "---- Kotlin/Java errors ----"
          grep -E '^e: |error:' build.log | head -25 | sed 's/^/::error::/' || true
          echo "---- Gradle summary ----"
          grep -A12 "What went wrong" build.log | head -30 || true

      - name: Show APK signing certificate
        continue-on-error: true
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for f in app/build/outputs/apk/full/debug/*.apk; do
            echo "== $f"
            "$APKSIGNER" verify --print-certs "$f" | grep -i "certificate SHA-256"
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: NuvioTV-full-debug-armeabi-v7a-${{ github.sha }}
          path: app/build/outputs/apk/full/debug/*armeabi-v7a*.apk
          if-no-files-found: error
          retention-days: 30
