name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare local properties
        run: |
          touch local.properties
          touch local.dev.properties

      - name: Prepare CI signing config
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/ci-debug.jks" \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000
          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/ci-debug.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=androiddebugkey"
            echo "NUVIO_RELEASE_KEY_PASSWORD=android"
            echo "NUVIO_RELEASE_STORE_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Build
        run: ./gradlew :app:assembleFullDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: nuvio-apks
          path: app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
